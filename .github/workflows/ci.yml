name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86-64,   os: ubuntu-latest }
          - { name: linux arm64,    os: ubuntu-24.04-arm }
          - { name: windows x86-64, os: windows-latest }
          - { name: macos arm64,    os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release
      - name: Property tests with overflow checks (debug)
        run: cargo test --test fuzz
      - name: Round-trip and RVLC damage figures
        run: cargo test --release --test roundtrip --test error_resilience -- --nocapture

  # The decoder against pictures from outside this crate: the published
  # conformance streams (ITU-T's H.263 set, an ISO/IEC 14496-4 stream),
  # which tools/fetch-conformance.sh downloads with their SHA-256, and Xvid
  # as a black box — tools/xvid-vectors.sh builds Xvid 1.3.7 from its
  # release tarball, codes a synthetic source with it one tool at a time,
  # and decodes those streams and this crate's encoder's with Xvid's
  # decoder. Without the sets the tests skip, so this job makes them and
  # requires them.
  conformance:
    name: conformance streams and Xvid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: tests/conformance/itu-h263
          key: mpeg4-conformance-${{ hashFiles('tools/fetch-conformance.sh') }}
      - run: tools/fetch-conformance.sh
      - run: tools/xvid-vectors.sh
      - name: Variants
        run: |
          MPEG4_VERBOSE=1 cargo test --release --test conformance -- --nocapture 2>&1 | grep -E " (qpel|simple|qpel_4mv_b) [0-9]+:" || true
        env:
          MPEG4_REQUIRE_CONFORMANCE: "1"

  msrv:
    name: MSRV (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  lint:
    name: clippy and rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
