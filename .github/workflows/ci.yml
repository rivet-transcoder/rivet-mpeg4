name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. CI is
# x86-64 Linux only. No Windows, macOS or arm64 jobs: the code stays
# portable, and the NEON (aarch64) paths are checked by hand on ARM hardware
# (README, "NEON on ARM hardware").

# id-token: a push to develop or main shows the compile cache's broker its
# OIDC token to be allowed to write the cache (ci-cache-setup).
permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The SIMD kernels (src/dsp) are checked bit-exact against the
        # scalar ones: SSE4.1 and AVX2 on x86-64 (NEON is checked by hand
        # on ARM hardware, see the README). MPEG4_REQUIRE_SIMD makes a host
        # without them fail rather than test the scalar kernels alone; the
        # scalar step runs the whole suite again with MPEG4_FORCE_SCALAR=1.
        include:
          - { name: linux x86-64 (AVX2),   os: safewords-runners }
    env:
      MPEG4_REQUIRE_SIMD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - name: Tests (SIMD kernels)
        run: cargo test --release
      - name: Tests (scalar kernels)
        run: cargo test --release
        env:
          MPEG4_FORCE_SCALAR: "1"
      - name: Property tests with overflow checks (debug)
        run: cargo test --test fuzz
      - name: Round-trip and RVLC damage figures
        run: cargo test --release --test roundtrip --test error_resilience -- --nocapture

  # The decoder against pictures from outside this crate: the published
  # conformance streams (ITU-T's H.263 set, an ISO/IEC 14496-4 stream),
  # which tools/fetch-conformance.sh downloads with their SHA-256, and Xvid
  # as a black box — tools/xvid-vectors.sh builds Xvid 1.3.7 from its
  # release tarball, codes a synthetic source with it one tool at a time,
  # and decodes those streams and this crate's encoder's with Xvid's
  # decoder. Without the sets the tests skip, so this job makes them and
  # requires them.
  #
  # Run with the SIMD kernels and with the scalar ones: every decoded picture of every stream must be the same both ways
  # (MPEG4_DECODE_HASHES records a hash per stream).
  conformance:
    name: conformance streams and Xvid (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-64, os: safewords-runners }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - uses: actions/cache@v4
        with:
          path: tests/conformance/itu-h263
          key: mpeg4-conformance-${{ hashFiles('tools/fetch-conformance.sh') }}
      - run: tools/fetch-conformance.sh
      - run: tools/xvid-vectors.sh
      - name: Tests (SIMD kernels)
        run: cargo test --release --test conformance -- --nocapture
        env:
          MPEG4_REQUIRE_CONFORMANCE: "1"
          MPEG4_REQUIRE_SIMD: "1"
          MPEG4_DECODE_HASHES: ${{ runner.temp }}/simd.txt
      - name: Tests (scalar kernels)
        run: cargo test --release --test conformance -- --nocapture
        env:
          MPEG4_REQUIRE_CONFORMANCE: "1"
          MPEG4_FORCE_SCALAR: "1"
          MPEG4_DECODE_HASHES: ${{ runner.temp }}/scalar.txt
      - name: Every picture the same with either
        run: |
          sort "$RUNNER_TEMP/simd.txt" > "$RUNNER_TEMP/a" && sort "$RUNNER_TEMP/scalar.txt" > "$RUNNER_TEMP/b"
          [ -s "$RUNNER_TEMP/a" ] && diff "$RUNNER_TEMP/a" "$RUNNER_TEMP/b" && wc -l < "$RUNNER_TEMP/a"

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo build --release

  lint:
    name: clippy and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # rivet's compile cache, warmed with this commit before rivet's submodule is
  # bumped to it: the commit built inside rivet exactly as rivet's CI builds
  # it (safewords/rivet-transcoder .github/workflows/codec-cache-warmup.yml).
  # Never fails this workflow.
  rivet-cache:
    name: warm rivet's compile cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: safewords/rivet-transcoder/.github/workflows/codec-cache-warmup.yml@develop
    with:
      crates: rivet-mpeg4
      submodule: crates/mpeg4
