name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. arm64 is
# covered on the same x86-64 runners: cross-compiled for
# aarch64-unknown-linux-gnu and run under QEMU's user-mode emulator, so the
# NEON kernels are still checked against the scalar ones. No Windows or macOS
# CI: the code stays portable, but nothing here tests it there.

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The SIMD kernels (src/dsp) are checked bit-exact against the
        # scalar ones on every host: SSE4.1 and AVX2 on x86-64, NEON on
        # arm64. MPEG4_REQUIRE_SIMD makes a host without them fail rather
        # than test the scalar kernels alone; the scalar step runs the
        # whole suite again with MPEG4_FORCE_SCALAR=1.
        include:
          - { name: linux x86-64 (AVX2),   os: safewords-runners }
          - { name: linux arm64 (NEON, QEMU),    os: safewords-runners, target: aarch64-unknown-linux-gnu }
    env:
      MPEG4_REQUIRE_SIMD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: aarch64 cross toolchain and QEMU
        # The arm64 entry: cargo builds for aarch64-unknown-linux-gnu and runs
        # every test binary under qemu-aarch64. The runner image has these;
        # the install is a fallback for an image that predates them.
        if: matrix.target
        run: |
          if ! command -v qemu-aarch64 >/dev/null || ! command -v aarch64-linux-gnu-gcc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          fi
          {
            echo "CARGO_BUILD_TARGET=${{ matrix.target }}"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64 -L /usr/aarch64-linux-gnu"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Tests (SIMD kernels)
        run: cargo test --release
      - name: Tests (scalar kernels)
        run: cargo test --release
        env:
          MPEG4_FORCE_SCALAR: "1"
      - name: Property tests with overflow checks (debug)
        run: cargo test --test fuzz
      - name: Round-trip and RVLC damage figures
        run: cargo test --release --test roundtrip --test error_resilience -- --nocapture

  # The decoder against pictures from outside this crate: the published
  # conformance streams (ITU-T's H.263 set, an ISO/IEC 14496-4 stream),
  # which tools/fetch-conformance.sh downloads with their SHA-256, and Xvid
  # as a black box — tools/xvid-vectors.sh builds Xvid 1.3.7 from its
  # release tarball, codes a synthetic source with it one tool at a time,
  # and decodes those streams and this crate's encoder's with Xvid's
  # decoder. Without the sets the tests skip, so this job makes them and
  # requires them.
  #
  # Run on x86-64 and arm64, each with the SIMD kernels and with the scalar
  # ones: every decoded picture of every stream must be the same both ways
  # (MPEG4_DECODE_HASHES records a hash per stream).
  conformance:
    name: conformance streams and Xvid (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-64, os: safewords-runners }
          - { name: arm64 (QEMU),  os: safewords-runners, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: aarch64 cross toolchain and QEMU
        # The arm64 entry: cargo builds for aarch64-unknown-linux-gnu and runs
        # every test binary under qemu-aarch64. The runner image has these;
        # the install is a fallback for an image that predates them.
        if: matrix.target
        run: |
          if ! command -v qemu-aarch64 >/dev/null || ! command -v aarch64-linux-gnu-gcc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          fi
          {
            echo "CARGO_BUILD_TARGET=${{ matrix.target }}"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64 -L /usr/aarch64-linux-gnu"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: tests/conformance/itu-h263
          key: mpeg4-conformance-${{ hashFiles('tools/fetch-conformance.sh') }}
      - run: tools/fetch-conformance.sh
      - run: tools/xvid-vectors.sh
      - name: Tests (SIMD kernels)
        run: cargo test --release --test conformance -- --nocapture
        env:
          MPEG4_REQUIRE_CONFORMANCE: "1"
          MPEG4_REQUIRE_SIMD: "1"
          MPEG4_DECODE_HASHES: ${{ runner.temp }}/simd.txt
      - name: Tests (scalar kernels)
        run: cargo test --release --test conformance -- --nocapture
        env:
          MPEG4_REQUIRE_CONFORMANCE: "1"
          MPEG4_FORCE_SCALAR: "1"
          MPEG4_DECODE_HASHES: ${{ runner.temp }}/scalar.txt
      - name: Every picture the same with either
        run: |
          sort "$RUNNER_TEMP/simd.txt" > "$RUNNER_TEMP/a" && sort "$RUNNER_TEMP/scalar.txt" > "$RUNNER_TEMP/b"
          [ -s "$RUNNER_TEMP/a" ] && diff "$RUNNER_TEMP/a" "$RUNNER_TEMP/b" && wc -l < "$RUNNER_TEMP/a"

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  lint:
    name: clippy and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
